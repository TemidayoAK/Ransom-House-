<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Ransom House Community Church — Chat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --maroon:#6E1F2A; --gold:#C9A24A; --cream:#FAF5EC; --ink:#2A1F1A; --line:#E6D9C4;
    box-sizing:border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  *{box-sizing:inherit;}
  html,body{height:100%; margin:0;}
  body{
    background:var(--cream); color:var(--ink); font-family:'Work Sans', system-ui, sans-serif;
    display:flex; align-items:flex-end; justify-content:flex-end; padding:24px;
  }
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --cream:#211814; --ink:#F3E9DC; --line:#4A3A30; } body{background:var(--cream);} }
  :root[data-theme="dark"]{ --cream:#211814; --ink:#F3E9DC; --line:#4A3A30; }

  .launcher{
    width:60px; height:60px; border-radius:50%; background:var(--maroon); color:#fff;
    border:none; font-size:24px; cursor:pointer; box-shadow:0 6px 18px rgba(0,0,0,.2);
    display:flex; align-items:center; justify-content:center;
  }
  .launcher.hide{display:none;}

  .panel{
    width:360px; max-width:calc(100vw - 32px); height:560px; max-height:calc(100vh - 32px);
    background:var(--cream); border:1px solid var(--line); border-radius:14px;
    display:none; flex-direction:column; overflow:hidden; box-shadow:0 12px 32px rgba(0,0,0,.22);
  }
  .panel.open{display:flex;}

  .head{
    background:var(--maroon); color:#fff; padding:16px 18px; display:flex; align-items:center; gap:10px;
  }
  .head .crest{
    width:34px; height:34px; border-radius:50%; background:var(--gold); color:var(--maroon);
    display:flex; align-items:center; justify-content:center; font-family:'Fraunces'; font-weight:600; font-size:16px; flex:none;
  }
  .head h1{font-family:'Fraunces'; font-size:15px; font-weight:600; margin:0; line-height:1.25;}
  .head p{font-size:12px; margin:2px 0 0; opacity:.85;}
  .head .close{margin-left:auto; background:none; border:none; color:#fff; font-size:20px; cursor:pointer; padding:4px;}

  .msgs{flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:10px;}
  .msg{max-width:82%; padding:10px 13px; border-radius:12px; font-size:14px; line-height:1.5;}
  .msg.bot{background:#fff; border:1px solid var(--line); align-self:flex-start; border-bottom-left-radius:3px;}
  .msg.user{background:var(--maroon); color:#fff; align-self:flex-end; border-bottom-right-radius:3px;}

  .quick{display:flex; flex-wrap:wrap; gap:8px; padding:0 16px 12px;}
  .chip{
    border:1px solid var(--maroon); color:var(--maroon); background:none; border-radius:999px;
    font-size:12.5px; padding:7px 12px; cursor:pointer; font-family:'Work Sans';
  }
  .chip:hover{background:var(--maroon); color:#fff;}

  .inputRow{display:flex; gap:8px; padding:12px 14px; border-top:1px solid var(--line); background:#fff;}
  .inputRow input{
    flex:1; border:1px solid var(--line); border-radius:999px; padding:10px 14px; font-size:14px;
    font-family:'Work Sans'; background:var(--cream); color:var(--ink);
  }
  .inputRow input:focus{outline:2px solid var(--maroon); outline-offset:1px;}
  .inputRow button{
    background:var(--maroon); color:#fff; border:none; border-radius:999px; padding:0 16px;
    font-weight:600; font-size:13px; cursor:pointer;
  }
</style>
</head>
<body>

<button class="launcher" id="launcher" onclick="openChat()" aria-label="Open chat">💬</button>

<div class="panel" id="panel">
  <div class="head">
    <div class="crest">RH</div>
    <div>
      <h1>The Ransom House<br>Community Church</h1>
      <p>Usually replies in a few minutes</p>
    </div>
    <button class="close" onclick="closeChat()" aria-label="Close chat">✕</button>
  </div>
  <div class="msgs" id="msgs"></div>
  <div class="quick" id="quick"></div>
  <div class="inputRow">
    <input id="inputBox" type="text" placeholder="Ask a question..." onkeydown="if(event.key==='Enter')sendTyped()">
    <button onclick="sendTyped()">Send</button>
  </div>
</div>

<script>
/* ---- Editable church info: update these before going live ---- */
const CHURCH = {
  serviceTimes: "Sundays at 9:00 AM and 11:00 AM, with Wednesday Bible Study at 6:30 PM.",
  location: "[Your church address here] — street parking and a side-lot are available.",
  nextEvent: "[Name your next event, date and time here].",
  contact: "You can reach the church office at [phone number] or [email address].",
  prayer: "We'd love to pray with you. Leave your request here and a member of our prayer team will follow up, or call the office directly at [phone number]."
};

const rules = [
  { keys:["time","when","sunday","service"], reply: () => "Our services: " + CHURCH.serviceTimes },
  { keys:["where","address","location","direction","park"], reply: () => "We're located at " + CHURCH.location },
  { keys:["event","upcoming","happening","calendar"], reply: () => "Coming up: " + CHURCH.nextEvent },
  { keys:["contact","phone","email","call","reach"], reply: () => CHURCH.contact },
  { keys:["pray","prayer","struggling","need help"], reply: () => CHURCH.prayer },
  { keys:["give","giving","donate","tithe","offering"], reply: () => "Giving options are available at the Welcome Desk on Sundays, or ask about our online giving link when you call the office." },
  { keys:["kids","children","nursery"], reply: () => "We have programs for children during both Sunday services — ask at the Welcome Desk when you arrive and a volunteer will walk you over." },
  { keys:["new","visit","first time"], reply: () => "Welcome! Just head to the Welcome Desk when you arrive — someone will greet you and help you find a seat." }
];

const fallback = "I don't have an answer for that yet — please call the church office at [phone number], or try asking about service times, location, or upcoming events.";

const quickOptions = [
  {label:"Service times", key:"time"},
  {label:"Location", key:"where"},
  {label:"Upcoming events", key:"event"},
  {label:"Prayer request", key:"pray"}
];

function openChat(){
  document.getElementById('panel').classList.add('open');
  document.getElementById('launcher').classList.add('hide');
  if(!document.getElementById('msgs').children.length){
    addMsg("Welcome to The Ransom House Community Church 🙏 How can I help you today?", 'bot');
    renderQuick();
  }
}
function closeChat(){
  document.getElementById('panel').classList.remove('open');
  document.getElementById('launcher').classList.remove('hide');
}

function addMsg(text, who){
  const el = document.createElement('div');
  el.className = 'msg ' + who;
  el.textContent = text;
  document.getElementById('msgs').appendChild(el);
  el.scrollIntoView({behavior:'smooth', block:'end'});
}

function renderQuick(){
  const q = document.getElementById('quick');
  q.innerHTML = '';
  quickOptions.forEach(o=>{
    const b = document.createElement('button');
    b.className = 'chip';
    b.textContent = o.label;
    b.onclick = () => handleInput(o.label, o.key);
    q.appendChild(b);
  });
}

function respond(text){
  const lower = text.toLowerCase();
  const hit = rules.find(r => r.keys.some(k => lower.includes(k)));
  return hit ? hit.reply() : fallback;
}

function handleInput(displayText, forcedKey){
  addMsg(displayText, 'user');
  const replyText = forcedKey ? rules.find(r=>r.keys.includes(forcedKey)).reply() : respond(displayText);
  setTimeout(()=> addMsg(replyText, 'bot'), 350);
}

function sendTyped(){
  const box = document.getElementById('inputBox');
  const val = box.value.trim();
  if(!val) return;
  box.value = '';
  handleInput(val);
}
</script>
</body>
</html>
